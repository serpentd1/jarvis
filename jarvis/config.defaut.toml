# ─────────────────────────────────────────────
#  Réglages de Jarvis — modifie, enregistre, puis « Redémarrer » dans le menu de l'icône.
# ─────────────────────────────────────────────

[general]
nom = "Jarvis"
# Phrase dite au démarrage (salut tu veut fair quoi aujourd'hui).
phrase_demarrage = "Jarvis est prêt."
# Lance l'île Jarvis (moteur natif) en même temps que l'assistant vocal.
lancer_givre = true
# Chemin de la barre, JarvisBarre.exe (vide = cherchée toute seule), et options de lancement.
givre_exe = ""
givre_arguments = ""

[micro]
# Vide = micro par défaut de Windows. Sinon, un morceau de son nom (ex : "WO Mic" pour un téléphone
# avec l'appli WO Mic, ou "Razer").
appareil = ""
# Sensibilité du « Hey Jarvis » : 0.3 = réagit facilement, 0.8 = très strict.
seuil_activation = 0.5
# Secondes de silence qui terminent ta phrase (plus grand = tu peux faire des pauses en parlant).
silence_fin = 0.6
# Durée maximale d'une commande, en secondes.
duree_max = 20
# Secondes d'attente pour que tu commences à parler après « Hey Jarvis ».
attente_debut = 6
# Après sa réponse, Jarvis t'écoute encore ce nombre de secondes : tu peux continuer
# à lui parler sans redire « Hey Jarvis ». 0 = désactivé.
conversation = 5
# Conversation continue : après sa réponse, Jarvis continue à t'écouter tant que tu ne dis pas
# « stop » (ou « Jarvis stop », « c'est bon », « au revoir »…). false = seulement les secondes ci-dessus.
conversation_continue = true
# Sans personne qui parle pendant ce nombre de secondes, la conversation se termine toute seule.
fin_conversation = 60
# Pendant la conversation, il faut parler au moins aussi fort que ça (la télé ou les bruits ne
# comptent pas). Monte-le (500, 800) s'il réagit tout seul, baisse-le (200) s'il ne t'entend pas.
volume_conversation = 350
# Petit « ding » quand Jarvis t'écoute.
ding = true
# Dire « Hey Jarvis » pendant qu'il parle le coupe.
interrompre = true
# Couper Jarvis en lui parlant, sans dire « Hey Jarvis ». Avec un casque (mode_casque = true), 2 ou 3 mots
# suffisent. Sans casque (enceinte), seuls les mots d'arrêt le coupent : « stop », « arrête », « tais-toi »,
# « c'est bon », « ça suffit », « chut », « merci c'est tout »… et la conversation s'arrête.
couper_en_parlant = true

[transcription]
# "large-v3-turbo" (Whisper, rapide et fiable, même sur les noms d'applis), "parakeet" (~700 Mo),
# "francais" (Whisper réentraîné pour le français, ~2,2 Go, moins bon sur les mots anglais), "small"…
modele = "large-v3-turbo"
# "auto" = carte graphique si possible, sinon processeur. Ou "cuda" / "cpu".
# (Parakeet tourne sur le processeur en "auto" : c'est plus rapide pour lui.)
appareil = "auto"
precision = "int8_float16"
# Mots que la transcription doit bien écrire (prénoms, applis…), séparés par des virgules.
mots = "Jarvis, Pronote"

[voix]
# La voix de Jarvis (change-la aussi dans le menu de l'icône, ou en disant « change de voix ») :
#   En ligne (gratuites, aucune mémoire graphique, voix locale si pas d'Internet) :
#   "denise"   : femme                         "henri"  : homme
#   "vivienne" : femme                         "remy"   : homme
#   Hors ligne :
#   "siwis_hd" : femme, la plus naturelle      "jarvis" : homme, accent anglais (expérimental)
#   "tom"      : homme                         "pierre" : homme
#   "jessica"  : femme                         "siwis"  : femme, rapide
voix = "denise"
# 1.0 = normal, 0.8 = plus rapide, 1.2 = plus lent.
lenteur = 1.0
volume = 1.0
# Où Jarvis parle : un morceau du nom du haut-parleur (ex : "JBL" pour l'enceinte Bluetooth). Seul Jarvis
# y parle (voix, « ding », annonces) : le reste du PC garde la sortie de Windows. Vide = la sortie de Windows.
# Si l'enceinte est éteinte, Jarvis parle sur la sortie de Windows et la cherche encore à la phrase suivante.
sortie = ""

[cerveau]
# L'IA se choisit dans les réglages de la barre (clic droit sur la barre, Paramètres, IA) :
# LM Studio sur le PC d'abord (gratuit), ou n'importe quelle clé d'API (gratuite d'abord, puis payante).
# Les deux réglages ci-dessous ne servent plus qu'au cerveau de secours, si la barre est absente.
ollama_url = "http://127.0.0.1:11434"
# qwen3.5:4b : rapide (≈0,3 s), léger (3,4 Go), sait déclencher des actions.
modele = "qwen3.5:4b"
# Facultatif : un petit modèle rapide rien que pour les ORDRES (« lance Discord », « mets un minuteur »…).
# Le modèle ci-dessus sert alors aux discussions. Vide = le même modèle pour tout.
# Attention : deux modèles chargés prennent plus de mémoire graphique.
modele_rapide = ""
# Nombre d'échanges dont Jarvis se souvient (voix + chat de l'île).
historique = 3
# Taille de la mémoire de travail du modèle (plus grand = plus de mémoire graphique).
contexte = 8192
# Durée pendant laquelle Ollama garde le modèle chargé. "0" = libère la carte graphique tout de suite.
garder_en_memoire = "30m"
# Créativité : 0 = sérieux et prévisible, 1 = fantaisiste.
temperature = 0.4

[conversation]
# En mode « ultra performant » (grande application › Paramètres › Mode de l'IA), la barre prend toute seule le gros
# modèle nemotron-3-ultra-550b (et super-vl-120b pour les images) : le modèle ci-dessous ne sert qu'en mode léger.
# Le modèle d'IA chez NVIDIA (build.nvidia.com, clé dans la variable NVIDIA_API_KEY ou dans les Paramètres
# de la barre). Rapide, sans raisonnement, avec outils et vision. Pour mesurer les plus rapides :
#   python outils/mesurer_modeles.py   (ajoute --ecrire pour garder le gagnant ici)
# Mesuré le 2026-11-17 (5 vraies commandes) : super-vl-120b 491 ms, 5/5, voit les images ;
# lightning-30b 337 ms, 5/5, plus petit ; ultra-550b 524 ms, 5/5, le plus fort mais 1 s avec un outil ;
# bolt-e4b : le plus rapide mais il ÉCRIT les commandes au lieu de les faire.
modele = "nvidia/nemotron-3.5-super-vl-120b-a12b"
# Le prompt système (la façon dont l'IA parle) est dans prompt-systeme.txt, à côté de ce fichier.
# Mode casque : le micro n'entend pas les haut-parleurs, donc pas d'annulation d'écho.
mode_casque = false
# Te couper la parole : il faut que ta voix dure au moins ce temps (secondes) pendant qu'il parle.
couper_apres = 0.3
# Pendant qu'il parle, le détecteur de voix est plus exigeant (0 à 1) pour ne pas réagir à son propre écho.
# Monte-le (0.9) s'il se coupe tout seul, baisse-le (0.7) s'il a du mal à t'entendre.
seuil_voix_pendant = 0.85
# Retard (millisecondes) entre le son envoyé par le PC et le son qui sort vraiment de l'enceinte, pour que
# l'anti-écho retire bien la voix de Jarvis du micro. 0 = automatique : 200 ms pour une enceinte Bluetooth
# (JBL, Bose, Sony…), 0 pour une sortie avec un fil. Un micro de téléphone (WO Mic) ajoute son propre retard :
# s'il se coupe tout seul sur sa voix, essaie 250, 300 ou 400.
delai_sortie_ms = 0
# Écrire dans le journal le temps de chaque étape (fin de ta phrase -> début de sa voix).
journal_latence = true
# Garder ta dernière phrase en fichier son (%APPDATA%\Jarvis\donnees\derniere-phrase-*.wav), pour
# comprendre une erreur d'écoute. Le fichier est remplacé à chaque phrase et ne quitte pas ce PC.
enregistrer_derniere_phrase = false

[givre]
url = "http://127.0.0.1:47802"

[serveur]
# API locale de Jarvis (l'île Givre et l'extension Chrome s'y connectent).
port = 47801

[annonces]
# Jarvis annonce à voix haute ce qui arrive.
actif = true
pronote = true
mail = true
discord = true
minuteur = true
# SMS, appels et batterie faible du téléphone (relié par « Mobile connecté »). Les codes ne sont jamais lus.
telephone = true
# Aussi les notifications des applis du téléphone (WhatsApp, Instagram…).
telephone_applis = false
# Pas d'annonces sur ce créneau (vide = jamais silencieux). Exemple : "22:00-07:00".
ne_pas_deranger = ""
# Lire à voix haute les réponses aux questions tapées dans l'île.
lire_reponses_ile = false

[discord]
# Jarvis te relit le message et attend ton « oui » avant d'envoyer.
confirmer_avant_envoi = true
# Nombre de messages gardés en mémoire.
memoire = 30

[whatsapp]
# Quand tu dis « appelle … » pour une de ces personnes, Jarvis l'appelle avec WhatsApp sur le PC
# (pas besoin de dire « avec WhatsApp »). Il te demande toujours « oui » avant d'appeler.
# Écris le nom comme dans tes contacts WhatsApp. Exemple : contacts = ["Anaïs", "Maman"]
contacts = []

[mise_a_jour]
# Jarvis se met à jour tout seul depuis les « Releases » GitHub. Vide = le dépôt d'origine (fichier DEPOT).
auto = true
depot = ""
verifier_toutes_les_heures = 6

[deezer]
# Ton numéro de profil Deezer, pour que « mets la playlist … » trouve d'abord TES playlists.
# Il est dans l'adresse de ton profil : https://www.deezer.com/fr/profile/123456789 -> "123456789"
# (ton profil doit être public). Vide = recherche dans tout Deezer.
utilisateur = ""

[meteo]
# Seulement si Givre n'est pas lancé (sinon Jarvis prend la météo de Givre).
ville = ""

# Surnoms d'applications : ce que tu dis = nom dans le menu Démarrer.
[applis]
navigateur = "Google Chrome"
internet = "Google Chrome"
"bloc-notes" = "Bloc-notes"
explorateur = "Explorateur de fichiers"
"mes fichiers" = "Explorateur de fichiers"
calculette = "Calculatrice"
musique = "Spotify"
roblox = "Roblox Player"
# la transcription écrit souvent « Cloud » pour « Claude » (sinon ça ouvre Darty Cloud)
cloud = "Claude"
clod = "Claude"

# Sites ouverts par « ouvre … » quand aucune application ne porte ce nom.
[sites]
youtube = "https://www.youtube.com"
gmail = "https://mail.google.com"
outlook = "https://outlook.live.com/mail/"
hotmail = "https://outlook.live.com/mail/"
discord = "https://discord.com/app"
netflix = "https://www.netflix.com"
twitch = "https://www.twitch.tv"
wikipedia = "https://fr.wikipedia.org"
"google maps" = "https://www.google.com/maps"
chatgpt = "https://chatgpt.com"

# « Trouve mon exposé d'histoire » : Jarvis cherche tes fichiers SEULEMENT dans ces dossiers.
# Noms connus : bureau, documents, telechargements, images, videos, musique ; ou un chemin complet ("D:\\Cours").
[fichiers]
dossiers = ["bureau", "documents", "telechargements", "images"]
profondeur = 6

# « Mode concentration » : ferme ces sites (onglets Chrome) et ces applis, active Ne pas déranger, lance un minuteur.
[concentration]
minutes = 25
fermer_sites = ["youtube", "discord", "tiktok", "instagram", "netflix", "twitch"]
fermer_applis = ["discord"]
# Mémoire de Jarvis : un coffre Obsidian (une note par souvenir, rangée par dossier). Ouvre ce dossier avec
# Obsidian (« Ouvrir un dossier comme coffre ») pour voir le graphe. Vide = Documents\Jarvis\Mémoire
[memoire]
coffre = ""
