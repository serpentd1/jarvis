[package]
name = "jarvis-lanceur"
version = "1.0.0"
edition = "2021"
description = "Jarvis.exe : lance l'assistant vocal Jarvis en arrière-plan, sans fenêtre"

[[bin]]
name = "Jarvis"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
