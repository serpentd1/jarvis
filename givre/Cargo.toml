[package]
name = "givre"
version = "0.1.0"
edition = "2024"
description = "Widgets de bureau en verre flou : heure, météo, calendrier, vacances, Pronote"

[dependencies]
aes = "0.8"
ab_glyph = "0.2"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
miniz_oxide = "0.8"
rqrr = "0.11"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-skia = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "2", features = ["json"] }
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "ApplicationModel", "UI_Notifications", "UI_Notifications_Management"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
